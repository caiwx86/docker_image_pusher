name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 5,17 * * *'


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:

        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        # 如果空间还是不够用，可以把以下开启，清理出更多空间
        remove-android: 'true'
        remove-codeql: 'true'
        build-mount-path: '/var/lib/'

    - name: Restart docker
      run: |
        sudo service containerd restart
        sudo service docker     restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        # 记录拉取/推送失败而被跳过的镜像
        failed_images=()

        # ------------------------------------------------------------------
        # 持久缓存：.cache/pushed.txt，每行格式为 "<远端digest> <images.txt中的原始行>"
        # 不再按天清理；只有远端 digest 变化（镜像有更新）或从未推送过才会重新 pull
        # ------------------------------------------------------------------
        CACHE_DIR=".cache"
        CACHE_FILE="$CACHE_DIR/pushed.txt"
        mkdir -p "$CACHE_DIR"
        touch "$CACHE_FILE"
        # 清理旧版本按日期命名的缓存文件
        find "$CACHE_DIR" -maxdepth 1 -type f -name '20??-??-??' -delete

        declare -A cache_map      # 原始行 -> 已推送时的 digest
        declare -A active_images  # 当前 images.txt 中存在的行（用于清理失效缓存）
        while IFS= read -r c || [ -n "$c" ]; do
            [[ -z "$c" ]] && continue
            cache_map["${c#* }"]="${c%% *}"
        done < "$CACHE_FILE"
        echo "已加载缓存条目数: ${#cache_map[@]}"

        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            # 添加--name
            rename=$(echo "$line" | awk -F'--name[ =]' '{if (NF>1) print $2}' |  awk '{print $1}')
            if [[ -n "$rename" ]]; then
               line=${line//--name=$rename/}
            fi
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            echo "image $image"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            if [[ -n "$rename" ]]; then
               image_name=$rename    
            fi
            echo "image_name: $image_name"
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            old_line=$line
            active_images["$old_line"]=1
            # 添加--name
            rename=$(echo "$line" | awk -F'--name[ =]' '{if (NF>1) print $2}' |  awk '{print $1}')
            if [[ -n "$rename" ]]; then
               line=${line//--name=$rename/}
            fi

            # ---------------- 缓存判断：不下载镜像层，只查询远端 digest ----------------
            image_ref=$(echo "$line" | awk '{print $NF}')
            remote_digest=$(docker buildx imagetools inspect "$image_ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            cached_digest="${cache_map[$old_line]}"
            if [[ -n "$cached_digest" ]]; then
                if [[ -z "$remote_digest" ]]; then
                    echo "无法获取远端 digest，沿用缓存，跳过镜像 $old_line"
                    continue
                fi
                if [[ "$cached_digest" == "$remote_digest" ]]; then
                    echo "镜像未变化，跳过镜像 $old_line"
                    continue
                fi
                echo "镜像 $old_line 有更新 ($cached_digest -> $remote_digest)，重新pull..."
            else
                echo "镜像 $old_line 未缓存，开始pull..."
            fi

            echo "docker pull $line"
            # pull 失败则记录并跳过该镜像，继续处理下一个
            if ! docker pull $line; then
                echo "::warning::拉取失败，跳过镜像: $old_line"
                failed_images+=("$old_line")
                continue
            fi
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            # 如果存在架构信息 将架构信息拼到镜像名称前面
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')

            # 获取 镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名例  例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            
            # 重命名
            if [[ -n "$rename" ]]; then
                image_name_tag=${image_name_tag//$image_name/$rename}
            else
                rename=$image_name 
            fi 

            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$rename]}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi

            # 将@sha256:等字符删除
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            echo "docker tag $image $new_image"
            docker tag $image $new_image
            echo "docker push $new_image"
            # push 失败则清理本地镜像、记录并跳过，继续处理下一个
            if ! docker push $new_image; then
                echo "::warning::推送失败，跳过镜像: $old_line"
                failed_images+=("$old_line")
                docker rmi $image || true
                docker rmi $new_image || true
                continue
            fi
            # 成功后更新缓存（拿不到 digest 时记为 unknown，下次有 digest 时会重新同步一次）
            cache_map["$old_line"]="${remote_digest:-unknown}"
            echo "已推送并写入缓存: $old_line"
            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi $image || true
            docker rmi $new_image || true
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="     
            
        done < images.txt
        
        # 重写缓存文件：只保留 images.txt 中仍存在的条目，排序以避免无意义的 diff
        : > "$CACHE_FILE"
        for k in "${!cache_map[@]}"; do
            if [[ -n "${active_images[$k]}" ]]; then
                echo "${cache_map[$k]} $k"
            fi
        done | LC_ALL=C sort >> "$CACHE_FILE"

        # 汇总失败的镜像（失败的不会更新缓存，下次运行会自动重试）
        if [ ${#failed_images[@]} -gt 0 ]; then
            echo "以下镜像处理失败，已跳过："
            printf '  %s\n' "${failed_images[@]}"
        fi

    - name: Commit
      uses: EndBug/add-and-commit@v9
      with:
        message: 'cwx: add pushed images'
        add: './.cache'
